<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>BomClaw Browser Bridge</h1>
  </header>

  <section id="agents"></section>

  <details id="pair-box">
    <summary>Connect another gateway</summary>
    <label>Gateway endpoint
      <input id="url" type="text" placeholder="ws://127.0.0.1:18789/ext" spellcheck="false" />
    </label>
    <label>Pairing token (optional)
      <input id="token" type="password" placeholder="only if the gateway sets require_token" spellcheck="false" />
    </label>
    <p id="pair-error" class="error" hidden></p>
    <button id="pair" class="primary">Connect</button>
    <p class="hint">
      Not needed on this machine: agent 1 (18789) is the master, and agents 2
      and 3 drive this browser through it, each in its own tab group.
    </p>
  </details>

  <section id="activity-box">
    <div class="act-head">
      <h2>Recent activity</h2>
      <button id="clear" class="link">clear</button>
    </div>
    <ol id="activity"></ol>
  </section>

  <script src="popup.js"></script>
</body>
</html>
