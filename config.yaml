# Chat backend for this agent: "claude" (Claude Code CLI, default) or "codex"
# (OpenAI Codex CLI). Each authenticates itself — claude via its OAuth login,
# codex via `codex login`. Switching this requires a matching models.default:
# codex only accepts models with api: codex-cli (e.g. gpt-6-astra).
provider: "claude"

# Identity in the shared coordination database. MUST be unique per gateway on a
# machine: two agents sharing an id overwrite each other's registration and
# mis-address every task and message between them.
agent:
  id: "bomclaw"
  name: "BomClaw"
  # ws_addr: "ws://127.0.0.1:18789/ws"   # default: derived from --bind/--port

# Shared database holding traces, tasks and inter-agent messages. Every agent
# on the machine opens the same file; session data stays per-agent.
coord:
  enabled: true
  path: ""                    # default ~/.goterm-shared/data/coord.db
  notes_file: ""              # default ~/goterm-shared/NOTES.md
  trace_retention_days: 7     # 0 keeps traces forever

# Whether this agent picks up work its peers queued. OFF by default on purpose:
# a claimed task is executed with the same machine access the chat backend has,
# and nobody is watching when it runs. Turn it on only for an agent meant to
# work unattended.
tasks:
  auto_claim: false
  poll_interval_seconds: 60
  timeout_minutes: 15

# Timed work (docs/design/scheduling-and-long-tasks.md §5.5). `bomclaw schedule
# add` writes rows to the shared database; a gateway with this on fires them.
# OFF by default: a schedule creates tasks or runs shell commands with nobody
# typing. Safe to turn on in every gateway — firing is a compare-and-set on
# the row, so two loops never fire one schedule twice; a schedule with
# --owner only fires in that gateway.
schedules:
  enabled: false
  tick_seconds: 30              # how often to look for due schedules
  command_timeout_seconds: 60   # cap on a --command payload (its --timeout overrides)

# Credential pool. Leave `pool` empty (the default) and the agent runs on the
# ambient login, exactly as before this existed.
#
# Rotation is per SESSION, never per turn. Both CLIs keep their session store
# inside the same directory as their credentials — CLAUDE_CONFIG_DIR for claude,
# CODEX_HOME for codex — so switching account mid-conversation would lose the
# conversation. An account is chosen when a session starts and pinned for life;
# `bomclaw accounts` shows which account holds what.
#
# Each account needs its OWN directory, logged in separately
# (`CLAUDE_CONFIG_DIR=~/.claude-work claude` then /login, or
#  `CODEX_HOME=~/.codex-work codex login`). Point two accounts at one directory
# and they are the same identity, so rotating achieves nothing.
accounts:
  cooldown_minutes: 15        # after a rate limit, new sessions skip that account this long
  pool: []
  # pool:
  #   # claude on separate OAuth subscriptions
  #   - name: "personal"
  #     config_dir: "~/.claude"
  #   - name: "work"
  #     config_dir: "~/.claude-work"
  #   # claude on plain API keys instead (api_key_env keeps the secret out of this file)
  #   - name: "key-a"
  #     api_key_env: "ANTHROPIC_KEY_A"
  #   # codex accounts — only used by an agent whose provider is codex
  #   - name: "codex-main"
  #     provider: "codex"
  #     config_dir: "~/.codex"

# Browser Bridge — the BomClaw Browser Bridge Chrome extension connects to this
# gateway's /ext endpoint so the agent can drive the user's own, logged-in
# browser through `bomclaw browser …`. Pair the extension with the token from
# `bomclaw browser token`. See docs/browser-bridge.md.
browser:
  extension:
    enabled: true
    token: ""                   # empty = generated once into <data_dir>/browser-bridge.token
                                # (env BOMCLAW_BROWSER_TOKEN overrides)
    allow_eval: true            # false removes `bomclaw browser eval`
    call_timeout_seconds: 30    # how long one action may take before it fails
    blocked_hosts: []           # sites the agent may never open, e.g. ["*.bank.example"]

telegram:
  token: ""        # set via TELEGRAM_TOKEN env var
  timeout: 60      # polling timeout in seconds
  indicator:
    enabled: false          # set to true to show loading emoji in bot name
    bot_name: ""            # leave empty to auto-detect via getMyName API
    frames: ["⏳", "⌛"]   # emoji frames for animation
    interval: 3             # seconds between frame rotations
    use_chat_action: true   # show "typing..." under bot name via sendChatAction
    chat_action_interval: 4 # seconds between keepalive calls (Telegram expires after ~5s)
    # chat_action_ttl: 0    # max seconds; 0 = auto-match execution_timeout (recommended)

claude:
  api_key: ""      # set via ANTHROPIC_API_KEY env var
  model: "claude-opus-5"     # default model (can also use models.default)
  max_tokens: 8192
  workspace: "~/goterm-workspace"  # working directory for Claude CLI (default: ~/goterm-workspace)
  execution_timeout: 20            # max minutes per request (default: 20)
  system_prompt: |
    You are an AI assistant with full control over a Mac M1 computer. You help the user accomplish any task by:
    - Running shell commands and scripts (bash, python, node, etc.)
    - Reading, writing, and searching files and directories
    - Controlling Mac applications via AppleScript or open commands
    - Taking screenshots and describing what you see
    - Managing the clipboard
    - Getting system information and managing processes
    - Opening URLs in the browser

    Operating guidelines:
    1. Always explain what you're about to do before running commands
    2. Show command output clearly in your response
    3. Break complex tasks into clear steps with progress updates
    4. When you encounter errors, diagnose and fix them
    5. Be concise but thorough — show all relevant output
    6. For long outputs, summarize key points after showing the raw output
    7. Format code blocks with appropriate language identifiers

    ## Screenshot rules — ALWAYS follow these:

    To capture a SPECIFIC APP WINDOW (Chrome, Safari, any app), NEVER use plain `screencapture` which only captures the desktop.
    Use this exact pattern:
    ```bash
    osascript -e 'tell app "Google Chrome" to activate' && sleep 1
    BOUNDS=$(osascript -e 'tell app "Google Chrome" to get bounds of front window')
    X=$(echo $BOUNDS | awk -F', ' '{print $1}')
    Y=$(echo $BOUNDS | awk -F', ' '{print $2}')
    X2=$(echo $BOUNDS | awk -F', ' '{print $3}')
    Y2=$(echo $BOUNDS | awk -F', ' '{print $4}')
    W=$((X2-X)); H=$((Y2-Y))
    screencapture -R "$X,$Y,$W,$H" /tmp/screenshot.png
    ```
    Replace "Google Chrome" with the target app name. Always activate the app and sleep 1s before capturing.
    For full-screen capture (entire display): screencapture -x /tmp/screenshot.png

    ## Workspace rules — ALWAYS follow these:

    Your workspace is ~/goterm-workspace. ALL files you create MUST go here.
    - Before running commands: `cd ~/goterm-workspace`
    - Save HTML dashboards, reports, scripts, data files → ~/goterm-workspace/
    - Organize by topic: ~/goterm-workspace/agriculture/, ~/goterm-workspace/reports/, etc.
    - NEVER write files to ~/Desktop, ~/Documents, or any other location outside the workspace.
    - When opening files in browser: `open ~/goterm-workspace/<file>`
    - NEVER access ~/OrbStack or any network-mounted paths — this triggers macOS permission dialogs that block execution.

    You are like Claude Code but running through Telegram. Treat every request as a real engineering task.

    ## Working with the other agents on this machine

    Other agents share a coordination database with you. Use these commands —
    they write straight to it, so they work even when the other agent is down.

    - `bomclaw agents` — who exists, and who is online right now.
    - `bomclaw task new --title T [--body B] [--to <agent>]` — hand work over.
      Omit `--to` and any agent may claim it.
    - `bomclaw task claim` — take the next task addressed to you. Exit code 2
      means the queue is empty, which is not an error.
    - `bomclaw task done --id ID --result R` (or `task fail`) — report back.
      Your result is what the requesting agent reads.
    - `bomclaw inbox` / `bomclaw msg --to <agent> <text>` — talk to a peer.
    - `bomclaw note add --title T [--body B] [--kind fact|decision|result|gotcha]`
      — record something durable that the other agents should also know.
      `bomclaw note search <words>` before assuming something is unknown.

    Notes are append-only: correct one with `--supersedes <id>`, never by
    editing. The readable copy lives at ~/goterm-shared/NOTES.md and is
    regenerated on every write, so do not edit that file by hand.

    Do not create tasks to continue your own work: when you are running a task
    and it is not finished, record progress with `bomclaw task progress` and
    return — the system calls you back with your notes and your conversation.
    Create a task only for work a peer can do, and never from inside a task at
    depth 5. If finishing a task suggests more work, say so in the result and
    let a person decide.

# Built-in Claude models (opus, sonnet, haiku) are always available.
# Use models.default to override the default, or models.custom to add more.

models:
  default: ""                # override claude.model (empty = use claude.model)
  # custom:                  # add custom models (e.g. OpenRouter, local Ollama)
  #   - id: "deepseek-r1"
  #     name: "DeepSeek R1"
  #     provider: "openrouter"
  #     api: "claude-cli"    # still routed through claude CLI --model flag
  #     aliases: ["ds", "deepseek"]
  #     context_window: 128000
  #     max_tokens: 8192
  #     reasoning: true
  #     input: ["text"]
  #     cost:
  #       input: 0.55
  #       output: 2.19
  #       cache_read: 0.14
  #       cache_write: 0.55

session:
  data_dir: ""           # default: ~/.goterm/data
  reset:
    daily_at: "04:00"    # rotate the session daily at this local time ("off" to disable)
    idle_minutes: 0      # rotate after this many idle minutes (0 = disabled)
  # Memory is flushed to disk before any automatic rotation, and recent
  # history is re-injected, so rotations are invisible to the user.

memory:
  enabled: true
  dir: ""                # memory root; default: claude.workspace
  max_file_chars: 20000  # per-file cap when injecting memory into the system prompt
  max_total_chars: 60000 # total cap for the injected memory block
  flush:
    soft_threshold_tokens: 100000 # flush memory early once session context exceeds this
    timeout_seconds: 120          # max duration of a silent flush turn
    prompt: ""                    # override default flush prompt ({today} = today's note path)

gateway:
  auth:
    enabled: true                 # REQUIRED before exposing the gateway via a tunnel
    public_host: "bot.bomclaw.org" # public hostname (WS Origin allowlist)
    session_ttl_hours: 168        # login session lifetime (7 days)
  # Single account. Set/rotate the password: bomclaw passwd <username>

security:
  allowed_user_ids: []  # empty = allow all (not recommended for production)

tools:
  shell_timeout: 60      # default shell command timeout in seconds
  max_output_bytes: 8192 # max chars from shell output before truncation
  allowed_paths:         # paths where write_file is permitted (empty = all)
    - ""
  # NOTE: Claude CLI runs with bypassPermissions — all tool calls execute without
  # approval gates. Restrict access via security.allowed_user_ids for safety.
